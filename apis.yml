aid: gridwise
name: Gridwise
description: >-
  Gridwise is an earnings-tracking and optimization platform for rideshare and
  delivery gig workers, aggregating mileage, trip, and income data across gig
  platforms such as Uber, Lyft, DoorDash, Grubhub, Instacart, and Amazon Flex so
  drivers can see where they earn most and drive more strategically. Alongside the
  consumer app, Gridwise operates Gridwise Analytics, a B2B mobility-data business
  that turns millions of anonymized driver location, trip, and earnings records
  into industry benchmarking, KPI, and market-intelligence products for gig
  mobility platforms, financial services, retailers/merchants, and autonomous
  vehicle fleets. Data is delivered as aggregated weekly reports, record-level
  trip datasets, and consumer/driver surveys through commercial engagement.
  Gridwise does not currently publish a public developer API; this profile
  captures its consumer, data-product, support, and policy surfaces.
